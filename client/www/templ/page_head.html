<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{PAGE_TITLE} {VERSION}{TESTNET}</title>
<script>
	// decide the theme before the stylesheet loads, to avoid a flash
	var auto_dark_mode = localStorage.getItem("auto_dark_mode")==="true"
	var dark_mode

	function css_filename() {
		return "static/gocoin.css"
	}

	function apply_theme_attr() {
		document.documentElement.setAttribute("data-theme", dark_mode ? "dark" : "light")
	}

	function set_theme() {
		apply_theme_attr()
		var e = document.createEvent("Event")
		e.initEvent("theme_changed", false, false)
		dark_light_icon.dispatchEvent(e)
	}

	function change_theme() {
		dark_mode = !dark_mode
		localStorage.setItem("dark_mode", dark_mode)
		set_theme()
	}

	if (auto_dark_mode) {
		dark_mode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
		window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', event => {
			dark_mode = event.matches
			set_theme()
		})
	} else {
		dark_mode = localStorage.getItem("dark_mode")==="true"
	}
	apply_theme_attr()
</script>
<link rel="stylesheet" href="static/gocoin.css" type="text/css" id="loaded_css">
<link rel="shortcut icon" href="static/favicon.ico" type="image/x-icon">
<script type="text/javascript" src="static/gocoin.js"></script>
<script>
/*_SESSION_ID_*/
/*_AVERAGE_FEE_SPB_*/
/*_SERVER_MODE_*/
/*_WALLET_ON_*/
/*_CHAIN_IN_SYNC_*/
var doc_title = document.title
var testnet = (doc_title.indexOf(" Testnet") != -1)

var new_block_audio_file = new Audio("static/new_block.mp3")
var back_online_audio_file = new Audio("static/back_online.mp3")

var last_blocks_left = -1

var webuimenu = [
	["/home", "Home"],
	["/wallet", "Wallet"],
	["/send", "Spend"],
	["/net", "Network"],
	["/txs", "Mempool"],
	["/blocks", "Blocks"],
	["/miners", "Miners"],
	["/textui", "Console"],
	["/counts", "Stats"]
]

if (server_mode) {
	// the virtual console gives a full control over the node
	webuimenu = webuimenu.filter(function(m) {return m[0]!="/textui"})
}

const BN_OFFLINE = "XXX"

function beep_clicked() {
	beep_new_block.checked = !beep_new_block.checked
	localStorage.setItem("new_block_beep", beep_new_block.checked?"true":"false")
}
</script>
</head>
<body>
<header class="topbar">
<div class="topbar-in">
	<a class="brand" href="/home" title="Node dashboard">
		<svg viewBox="0 0 24 24" aria-hidden="true">
			<rect class="mark-b" x="2" y="13" width="9" height="9" rx="2"/>
			<rect class="mark-b" x="13" y="13" width="9" height="9" rx="2"/>
			<rect class="mark-a" x="7.5" y="2" width="9" height="9" rx="2"/>
		</svg>
		<span id="brand_title"></span>
		<span class="testnet-badge" id="testnet_badge" style="display:none">testnet</span>
	</a>

	<nav class="nav" id="topmenu" aria-label="Pages"></nav>
	<span id="rightmenu" style="display:none"></span>

	<div class="topbar-right">
		<a href="javascript:pushtx()" class="topmenu action" title="Load a raw transaction into the mempool">Load TX</a>
		<a id="helpmenulink" href="{HELPURL}" class="topmenu" title="Help for this page">Help</a>

		<img id="chainsync_icon" src="static/chainsync.png" class="hand" style="display:none" onclick="set_tblock_hash()" alt="">

		<label class="beep" title="Beep on each new block">
			<input type="checkbox" id="beep_new_block">
			<img class="music_icon" alt="">
			<span class="beep-led"></span>
		</label>

		<button type="button" id="dark_light_icon" class="iconbtn" onclick="change_theme()" title="Switch light / dark theme" aria-label="Switch theme">
			<svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
			<svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
		</button>

		<span class="blpill" id="blpill" title="Chain height"><span class="dot"></span><span id="blno">...</span></span>
		<input type="text" id="autocopy" style="display:none;font-size:1px;width:10px;height:4px;position:absolute;left:-1000px" tabindex="-1" aria-hidden="true">
	</div>
</div>
</header>

<script>

if (auto_dark_mode) {
	dark_light_icon.style.display = "none"
}

brand_title.innerText = doc_title.replace(" Testnet", "").trim()
if (testnet) testnet_badge.style.display = "inline-block"

function set_tblock_hash() {
	gc_prompt("To speed up the chain sync, enter the hash of the highest block you trust. Blocks up to that one will not have their signatures verified.", "",
		{title:"Trusted block", ok:"Apply", placeholder:"block hash (64 hex chars)"}).then(function(hash) {
		if (hash!=null && hash.trim()!="") {
			var aj = ajax()
			aj.onload = function() {
				location.reload()
			}
			aj.open("GET","cfg?sid="+sid+"&trusthash="+hash.trim(), true)
			aj.send(null)
		}
	})
}

function apply_wallet_on() {
	var items = topmenu.querySelectorAll('a[data-wallet]')
	for (var i=0; i<items.length; i++) {
		if (wallet_on) {
			items[i].classList.remove('dimenu')
			items[i].title = items[i].getAttribute('data-key')
		} else {
			items[i].classList.add('dimenu')
			items[i].title = 'Wallet functionality is off'
		}
	}
}

for (var i=0; i < webuimenu.length; i++) {
	var a = document.createElement('a')
	var akey = (i+1).toString()
	a.href = webuimenu[i][0]
	a.text = webuimenu[i][1]
	a.accessKey = akey
	a.title = "Alt+"+akey
	a.setAttribute('data-key', a.title)
	a.className = 'topmenu'
	if (webuimenu[i][0]=="/wallet" || webuimenu[i][0]=="/send") {
		a.setAttribute('data-wallet', '1')
	}
	if (document.location.pathname==webuimenu[i][0]) {
		a.classList.add('menuat')
	}
	topmenu.appendChild(a)
}
apply_wallet_on()
if (document.location.pathname=='/help') helpmenulink.classList.add('menuat')

var time_now /*_TIME_NOW_*/
function refreshblock() {
	var aj = ajax()
	aj.onerror=function() {
		blno.innerText = BN_OFFLINE
		blpill.classList.add('offline')
		blpill.title = 'Node is not responding'
		setTimeout(refreshblock, 10000)
	}
	aj.onload=function() {
		var new_block = false
		try {
			var stat = JSON.parse(aj.responseText)

			var blocks_left = stat.LastHeaderHeight - stat.Height
			if (blocks_left != last_blocks_left) {
				chainsync_icon.title = blocks_left + " blocks left - click to set a trusted block hash"
			}
			if (chain_in_sync != stat.BlockChainSynchronized) {
				chain_in_sync = stat.BlockChainSynchronized
				set_chain_in_sync()
			}

			if (stat.WalletON != wallet_on) {
				wallet_on = stat.WalletON
				apply_wallet_on()
			}

			blpill.classList.remove('offline')
			blpill.title = "Last block received " + ((stat.Time_now-stat.Received)/60).toFixed(1) + " min ago"
			if (blno.innerText != stat.Height) {
				if (beep_new_block.checked)  {
					if (blno.innerText==BN_OFFLINE) {
						back_online_audio_file.play()
					} else if (blno.innerText.indexOf("...")==-1) {
						new_block_audio_file.play()
					}
				}
				if (blno.innerText.indexOf("...")==-1 && blno.innerText!=BN_OFFLINE) {
					blpill.classList.remove('tick')
					void blpill.offsetWidth
					blpill.classList.add('tick')
				}
				new_block = true
				blno.innerText = stat.Height
				document.title = doc_title + ' @ ' + stat.Height
			}

			// dispatch event..
			var e = document.createEvent("Event")
			e.initEvent("lastblock", false, false)
			e.block = stat
			time_now = stat.Time_now
			blno.dispatchEvent(e)
		} catch(e) {
			blno.title = e
			blno.innerText = "???"
		}
		setTimeout(refreshblock, new_block?1000:6000)
	}
	aj.open("GET","status.json",true)
	aj.send(null)
}

function set_chain_in_sync() {
	chainsync_icon.style.display = chain_in_sync ? 'none' : 'inline'
}
set_chain_in_sync()

if (localStorage.getItem("new_block_beep")==="true") {
	beep_new_block.checked = true
}

document.addEventListener('DOMContentLoaded', function() {
	beep_new_block.onchange = function(event) {
		localStorage.setItem("new_block_beep", beep_new_block.checked?"true":"false")
	}
	refreshblock()
})

</script>
<main class="page">
